version: 2.1

jobs:
  FastqcTrim:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write fastq
          command: |
            printf '@r1\nACGT\n+\nIIII\n' > r.fq
      - run:
          name: Build QC trimmer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target FastqcTrim -j2
      - run:
          name: Trim low-quality bases
          command: LIONSS_LP=1 ./build/FastqcTrim --in r.fq --qual 20
  gffMerge:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write annotations
          command: |
            printf 'chr1 gene 1 100\n' > a.gff
      - run:
          name: Build annotation merger
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gffMerge -j2
      - run:
          name: Merge GFF records
          command: LIONSS_LP=1 ./build/gffMerge --in a.gff --feature gene
  cmaessigma:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set population
          command: |
            printf 'lambda 16\n' > cma.cfg
      - run:
          name: Build evolution strategy
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cmaessigma -j2
      - run:
          name: Adapt CMA sigma
          command: LIONSS_LP=1 ./build/cmaessigma --conf cma.cfg --sigma0 0.3
  rk4_adaptive:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
